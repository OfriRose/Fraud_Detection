[project]
name = "fraud-detection"
version = "1.0.0"
description = "Leakage-safe, temporally validated credit-card fraud detection."
authors = [{ name = "Fraud Detection Contributors" }]
readme = "readme.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "xgboost>=2.1,<4.0",
    "tabulate>=0.9,<1.0",
]

[tool.poetry]
packages = [{ include = "fraud_detection", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-cov = ">=5.0,<8.0"
ruff = ">=0.8,<1.0"
jupyter = ">=1.1,<2.0"
openpyxl = ">=3.1,<4.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["fraud_detection"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    ".ipynb_checkpoints",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
